[project]
name = "digital-gold"
version = "1.0.0"
description = "Is Bitcoin digital gold? An empirical study of BTC against physical gold and safe-haven currencies."
authors = [{ name = "BUSH.AI" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "streamlit (>=1.40,<2.0)",
    "pandas (>=2.2,<3.0)",
    "numpy (>=1.26,<3.0)",
    "requests (>=2.32,<3.0)",
    "plotly (>=5.24,<7.0)",
]

[project.urls]
Repository = "https://github.com/Bush-Code/digital-gold"

[tool.poetry]
packages = [{ include = "digital_gold", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
requests-mock = "^1.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
